
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple & Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
    <header>
        <h1>Calculator</h1>
        <p>Simple & Scientific</p>
    </header>

    <div class="tabs">
        <button class="tab active" data-mode="simple">Simple</button>
        <button class="tab" data-mode="scientific">Scientific</button>
    </div>

    <div class="screen">
        <div id="history"></div>
        <input id="display" type="text"
               placeholder="0" readonly aria-label="Calculator display">
    </div>

    <div class="angle-row" id="angleRow" hidden>
        <span>Angle mode</span>
        <button id="angleMode">DEG</button>
    </div>

    <div class="buttons" id="buttons">
        <!-- Common buttons -->
        <button class="utility" data-action="clear">AC</button>
        <button class="utility" data-action="delete">DEL</button>
        <button class="utility" data-value="(">(</button>
        <button class="utility" data-value=")">)</button>
        <button class="operator" data-value="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>
        <button class="scientific" data-value="sqrt(">√</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>
        <button class="scientific" data-value="^2">x²</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>
        <button class="scientific" data-value="^">xʸ</button>

        <button data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="scientific" data-value="pi">π</button>
        <button class="scientific" data-value="e">e</button>
        <button class="equal" data-action="calculate">=</button>

        <!-- Scientific-only buttons -->
        <button class="scientific" data-value="sin(">sin</button>
        <button class="scientific" data-value="cos(">cos</button>
        <button class="scientific" data-value="tan(">tan</button>
        <button class="scientific" data-value="log(">log</button>
        <button class="scientific" data-value="ln(">ln</button>

        <button class="scientific" data-value="asin(">sin⁻¹</button>
        <button class="scientific" data-value="acos(">cos⁻¹</button>
        <button class="scientific" data-value="atan(">tan⁻¹</button>
        <button class="scientific" data-value="!">x!</button>
        <button class="scientific" data-value="%">%</button>
    </div>

    <footer>Built with HTML, CSS & JavaScript</footer>
</div>

<script src="script.js"></script>
</body>
</html>
